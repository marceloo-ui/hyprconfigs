# Idle behavior for the Omarchy-style screensaver.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# This only shows the screensaver when idle. It deliberately does NOT lock
# the session: use the israshell lock keybind/button when you want that.

general {
    lock_cmd = qs -c isra ipc call lockscreen lock
    before_sleep_cmd = /home/etternalize/.local/bin/screensaver stop
}

listener {
    timeout = 150
    on-timeout = /home/etternalize/.local/bin/screensaver start
    on-resume = /home/etternalize/.local/bin/screensaver stop
}
